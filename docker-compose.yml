services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      # Se pasa al build para que Next hornee el destino del rewrite /proxy.
      # El valor se toma del .env (interpolacion de compose).
      args:
        LOAD_BALANCER_URL: ${LOAD_BALANCER_URL:-}
    image: nexacloud-web
    container_name: nexacloud
    # host:80 -> contenedor:3000  (Next escucha en 3000)
    ports:
      - "80:3000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
